version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: waziup/kijanicooling-backend:latest
    container_name: waziup.kijanicooling-backend
    environment:
      - PYTHONUNBUFFERED=1
      - WAZIGATE_URL=http://host.docker.internal:80
    extra_hosts:
      - "host.docker.internal:host-gateway" # Resolve host.docker.internal to host IP
    ports:
      - "5000:5000" # API (util_api)
    networks:
      - kijanicooling
    labels:
      - "io.waziup.waziapp=waziup.kijanicooling"

  frontend:
    build:
      context: ./frontend/web_application
      dockerfile: Dockerfile
    image: waziup/kijanicooling-frontend:latest
    container_name: waziup.kijanicooling-frontend
    ports:
      - "5174:5174" # nginx: web app + /kijanicooling/api/ proxied to backend:5000
    depends_on:
      - backend
    networks:
      - kijanicooling
    labels:
      - "io.waziup.waziapp=waziup.kijanicooling"

networks:
  kijanicooling:
    driver: bridge